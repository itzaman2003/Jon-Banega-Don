  <script type="text/babel">

      { id: 8, name: "Delegate 08", role: "Over-Optimist", subcommittee: "Unwarranted Hype", isPrimary: false, avatar: "✨", voteTendency: "AYE" },

      { id: 18, name: "Delegate 18", role: "Spiritual Compliance Officer", subcommittee: "Karmic Impact", isPrimary: false, avatar: "🔮", voteTendency: "ABSTAIN" },
      { id: 19, name: "Delegate 19", role: "Venture Capital Echo", subcommittee: "Synergy & Valuation", isPrimary: false, avatar: "📈", voteTendency: "AYE" },

      { id: 21, name: "Delegate 21", role: "Chief Escalation Specialist", subcommittee: "Panic & Alarm", isPrimary: false, avatar: "🚨", voteTendency: "REFER" },
      { id: 22, name: "Delegate 22", role: "Subpoena Coordinator", subcommittee: "Audits & Inquiries", isPrimary: false, avatar: "📜", voteTendency: "REFER" },
      { id: 23, name: "Delegate 23", role: "Dopamine Recalibrator", subcommittee: "Biometric Sentiment", isPrimary: false, avatar: "🧬", voteTendency: "AYE" },
      { id: 24, name: "Delegate 24", role: "The Fatalist", subcommittee: "Inevitability Studies", isPrimary: false, avatar: "💀", voteTendency: "ABSTAIN" },

      { id: 26, name: "Delegate 26", role: "Archive Hoarder", subcommittee: "Historical Precedent", isPrimary: false, avatar: "📦", voteTendency: "REFER" },

      { id: 28, name: "Delegate 28", role: "Consensus Saboteur", subcommittee: "Contrarian Strategy", isPrimary: false, avatar: "💣", voteTendency: "NAY" },
      { id: 29, name: "Delegate 29", role: "Vibe Auditor", subcommittee: "Tone Analysis", isPrimary: false, avatar: "🎧", voteTendency: "ABSTAIN" },
      { id: 30, name: "Delegate 30", role: "Sub-Delegate to Delegate 04", subcommittee: "Bureaucracy Duplication", isPrimary: false, avatar: "📎", voteTendency: "REFER" },
      { id: 31, name: "Delegate 31", role: "Lunch Schedule Warden", subcommittee: "Recess Planning", isPrimary: false, avatar: "🥪", voteTendency: "REFER" },
      { id: 32, name: "Delegate 32", role: "Edge Case Extrapolator", subcommittee: "Quantum Catastrophes", isPrimary: false, avatar: "🌌", voteTendency: "REFER" },
      { id: 33, name: "Delegate 33", role: "Meeting Extender", subcommittee: "Agenda Elongation", isPrimary: false, avatar: "⏱️", voteTendency: "REFER" },
      { id: 34, name: "Delegate 34", role: "Rubber Duck Representative", subcommittee: "Sounding Boards", isPrimary: false, avatar: "🦆", voteTendency: "AYE" },
      { id: 35, name: "Delegate 35", role: "Redundant Verifier", subcommittee: "Double Check Unit", isPrimary: false, avatar: "👀", voteTendency: "REFER" },
      { id: 36, name: "Delegate 36", role: "Devil's Advocate Intern", subcommittee: "Spite & Counter-points", isPrimary: false, avatar: "😈", voteTendency: "NAY" },
      { id: 37, name: "Delegate 37", role: "Chief AI Adjudicator", subcommittee: "Executive Deadlock", isPrimary: false, avatar: "👑", voteTendency: "REFER" }
    ];

    const PRESETS = [
      "Should I reply 'haha' or 'lol'?",
      "Should I have chai or coffee right now?",
      "Can I commit directly to main on a Friday at 5:00 PM?",
      "Should I close my 87 open browser tabs?",
      "Should I send a thumbs up 👍 or write 'sounds good'?"
    ];

    // Procedural Generator Engine for Instant Local Execution
    function generateResolution(question) {
      const q = question.trim();
      return {
        id: `CNC-${Math.floor(100000 + Math.random() * 900000)}`,
        question: q,
        timestamp: new Date().toLocaleTimeString(),
        primaryArguments: [
          {
            role: "The Rationalist",
            name: "Dr. Alistair Vance",
            avatar: "📐",
            position: `We must formulate an empirical multi-variable regression model for: "${q}".`,
            reasoning: "A statistical power analysis requires at least 4,200 peer-reviewed conversational interactions before an acceptable confidence interval (p < 0.001) is reached.",
            objection: "The Chaos Agent operates entirely outside Bayesian probability boundaries.",
            confidence: 42,
            nextStep: "Commission a longitudinal observational trial."
          },
          {
            role: "The Chaos Agent",
            name: "NullPointer_0x42",
            avatar: "🔥",
            position: "Send an uncompressed 4GB zip file labeled 'CRITICAL_ASSETS' and vanish into the woods.",
            reasoning: "True conversational leverage is established solely by violating conversational protocols.",
            objection: "The Bureaucrat wants to file forms when we could orchestrate pure social entropy.",
            confidence: 99,
            nextStep: "Drop all foreign keys and disable notifications."
          },
          {
            role: "The Risk Officer",
            name: "Victoria Sterling",
            avatar: "🛡️",
            position: "Immediate cessation of all activity. Institute a communication containment perimeter.",
            reasoning: "Any unvetted interaction risks catastrophic reputational damages, emotional liabilities, and potential anti-trust sanctions.",
            objection: "The Silicon Valley Visionary is courting third-degree emotional bankruptcy.",
            confidence: 12,
            nextStep: "Draft an indemnity waiver and consult outside counsel."
          },
          {
            role: "The Bureaucrat",
            name: "Harold Penndleton",
            avatar: "📋",
            position: "Motion to table this inquiry pending Triplicate Form 88-B clearance.",
            reasoning: "Under Council Protocol § 14.3(c), no human impulse may be acted upon without an approved Pre-Action Charter.",
            objection: "The Rationalist formulated a hypothesis without paying the filing fee.",
            confidence: 100,
            nextStep: "Form an ad-hoc steering committee to evaluate committee formation criteria."
          },
          {
            role: "The Silicon Valley Visionary",
            name: "Aria Thorne",
            avatar: "🚀",
            position: "Disrupt the dilemma. Monetize the hesitation into an agentic micro-SaaS.",
            reasoning: "Why choose when you can pivot the hesitation into a frictionless conversational micro-ecosystem powered by recursive vibes?",
            objection: "The Risk Officer suffers from zero growth mindset.",
            confidence: 94,
            nextStep: "Raise a $12M seed round to streamline simple choices at scale."
          }
        ],
        verdict: {
          status: "DECISION DEFERRED (INDEFINITELY)",
          summary: "Following exhaustive multi-agent deliberation, the Council of 37 finds itself deadlocked by recursive procedural jurisprudence. Taking any action is deemed an unacceptable departure from established stalling protocols.",
          confidenceScore: 99.87,
          mandatoryNextSteps: [
            "Form Subcommittee 14-A to evaluate conversational tone nuances.",
            "Mandate a 72-hour cooling period while drafting a 40-page environmental impact dossier.",
            "Schedule an emergency 6-hour follow-up caucus to vote on the previous vote's agenda."
          ],
          subcommitteesFormed: [
            "Working Group on Punctuation Semantics",
            "Ad-Hoc Steering Council on Tone Deflation",
            "Executive Oversight Bureau of Indecisive Outcomes"
          ],
          chairpersonNote: "37 agents convened. 0 decisions rendered. Maximum enterprise governance achieved."
        }
      };
    }

    function App() {
      const [question, setQuestion] = useState("");
      const [state, setState] = useState('IDLE');
      const [activeSpeakerId, setActiveSpeakerId] = useState(null);
      const [activeArguments, setActiveArguments] = useState([]);
      const [activeVotes, setActiveVotes] = useState({});
      const [tally, setTally] = useState({ aye: 0, nay: 0, abstain: 0, refer: 0 });
      const [resolution, setResolution] = useState(null);
      const [history, setHistory] = useState([]);
      const [copied, setCopied] = useState(false);

      const handleConvene = async (customQ) => {
        const query = customQ || question;
        if (!query.trim() || state !== 'IDLE') return;

        setState('CONVENING');
        setActiveArguments([]);
        setActiveVotes({});
        setTally({ aye: 0, nay: 0, abstain: 0, refer: 0 });
        setResolution(null);

        const data = generateResolution(query);

        // State: DEBATING (Stream arguments)
        setState('DEBATING');
        for (let i = 0; i < data.primaryArguments.length; i++) {
          setActiveSpeakerId(INITIAL_DELEGATES[i].id);
          await new Promise(r => setTimeout(r, 800));
          setActiveArguments(prev => [...prev, data.primaryArguments[i]]);
        }
        setActiveSpeakerId(null);

        // State: VOTING (Roll-call for 37 delegates)
        setState('VOTING');
        const voteMap = {};
        let a = 0, n = 0, abs = 0, ref = 0;

        for (let i = 0; i < INITIAL_DELEGATES.length; i++) {
          const d = INITIAL_DELEGATES[i];
          let v = d.voteTendency;
          // Chaotic distribution based on question
          if ((d.id + query.length) % 7 === 0) v = "REFER";
          else if ((d.id + query.length) % 11 === 0) v = "ABSTAIN";

          voteMap[d.id] = v;
          if (v === 'AYE') a++;
          else if (v === 'NAY') n++;
          else if (v === 'ABSTAIN') abs++;
          else if (v === 'REFER') ref++;

          if (i % 3 === 0 || i === INITIAL_DELEGATES.length - 1) {
            setActiveVotes({ ...voteMap });
            setTally({ aye: a, nay: n, abstain: abs, refer: ref });
            await new Promise(r => setTimeout(r, 60));
          }
        }

        // State: VERDICT & COMPLETE
        await new Promise(r => setTimeout(r, 600));
        setState('VERDICT');
        setResolution(data);
        setHistory(prev => [data, ...prev.slice(0, 3)]);
        setState('COMPLETE');
      };

      const handleReset = () => {
        setState('IDLE');
        setActiveArguments([]);
        setActiveVotes({});
        setResolution(null);
        setTally({ aye: 0, nay: 0, abstain: 0, refer: 0 });
      };

      const copyVerdict = () => {
        if (!resolution) return;
        const text = `🏛️ THE COUNCIL OF 37 AIS RULING\nCase: "${resolution.question}"\nVerdict: ${resolution.verdict.status}\n\nResolution: ${resolution.verdict.summary}\nSubcommittees Formed:\n- ${resolution.verdict.subcommitteesFormed.join("\n- ")}\n\n"37 agents. 0 decisions. Infinite intelligence."`;
        navigator.clipboard.writeText(text);
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      };

      return (
        <div className="max-w-7xl mx-auto px-4 py-6 flex flex-col min-h-screen">
          {/* Header */}
          <header className="flex flex-wrap items-center justify-between gap-4 border-b border-indigo-950 pb-5 mb-8">
            <div className="flex items-center gap-3">
              <span className="text-3xl">🏛️</span>
              <div>
                <h1 className="text-xl font-bold tracking-tight text-white flex items-center gap-2">
                  The Council of 37 AIs
                  <span className="text-[10px] font-mono uppercase bg-cyan-950 text-cyan-400 border border-cyan-800 px-2 py-0.5 rounded">
                    Chamber Online
                  </span>
                </h1>
                <p className="text-xs font-mono text-slate-400">
                  Autonomous Committee for High-Stakes Conversational Over-Engineering
                </p>
              </div>
            </div>
            <div className="flex items-center gap-2">
              <span className="text-xs font-mono bg-slate-900 border border-slate-800 text-slate-300 px-3 py-1.5 rounded-full flex items-center gap-2">
                <span className={`h-2 w-2 rounded-full ${state === 'IDLE' ? 'bg-slate-500' : 'bg-emerald-400 animate-ping'}`} />
                State: <span className="font-bold text-cyan-400">{state}</span>
              </span>
            </div>
          </header>

          {/* Question Input & Presets */}
          <section className="bg-slate-900/90 border border-indigo-900/40 rounded-2xl p-5 mb-8 shadow-2xl backdrop-blur-lg">
            <label className="block text-xs font-mono uppercase tracking-widest text-slate-400 mb-2">
              Dilemma to Deliberate:
            </label>
            <div className="flex flex-col sm:flex-row gap-3">
              <input
                type="text"
                disabled={state !== 'IDLE'}
                value={question}
                onChange={(e) => setQuestion(e.target.value)}
                onKeyDown={(e) => e.key === 'Enter' && handleConvene()}
                placeholder="E.g., Should I reply 'haha' or 'lol'?"
                className="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-100 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition disabled:opacity-50"
              />
              <button
                disabled={state !== 'IDLE' || !question.trim()}
                onClick={() => handleConvene()}
                className="px-6 py-3 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-semibold text-sm rounded-xl shadow-lg shadow-cyan-950/50 disabled:opacity-40 transition"
              >
                {state === 'IDLE' ? 'Convene 37 AIs ⚡' : 'In Session...'}
              </button>
            </div>

            <div className="mt-3 flex flex-wrap items-center gap-2">
              <span className="font-mono text-[11px] text-slate-500">Presets:</span>
              {PRESETS.map((preset, idx) => (
                <button
                  key={idx}
                  disabled={state !== 'IDLE'}
                  onClick={() => {
                    setQuestion(preset);
                    handleConvene(preset);
                  }}
                  className="bg-slate-950 hover:bg-slate-800 text-slate-300 border border-slate-800 px-2.5 py-1 rounded-lg text-[11px] transition disabled:opacity-40"
                >
                  "{preset}"
                </button>
              ))}
            </div>
          </section>

          {/* Chamber Visualizer & Active Deliberation Panel */}
          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 mb-8 flex-1">
            {/* Left 7 Columns: 37 Seats Layout + Voting Board */}
            <div className="lg:col-span-7 space-y-6">
              <div className="bg-slate-950/80 border border-indigo-900/40 rounded-2xl p-6 shadow-2xl relative">
                <div className="flex items-center justify-between mb-4 border-b border-indigo-950 pb-2">
                  <div className="flex items-center gap-2">
                    <span className="h-2 w-2 rounded-full bg-cyan-400 animate-pulse" />
                    <h3 className="text-xs uppercase font-mono tracking-widest text-cyan-400">
                      Council Chamber (37 Seats)
                    </h3>
                  </div>
                  <span className="text-[11px] font-mono text-slate-400">
                    5 Orators • 32 Delegates
                  </span>
                </div>

                {/* Concentric Arc SVG */}
                <div className="h-64 flex items-center justify-center relative">
                  <svg viewBox="0 0 440 260" className="w-full h-full max-w-md filter drop-shadow">
                    <ellipse cx="220" cy="210" rx="36" ry="18" fill="#0f172a" stroke="#38bdf8" strokeWidth="1.5" strokeDasharray="3 3" />
                    <text x="220" y="213" textAnchor="middle" fill="#38bdf8" fontSize="9" fontFamily="monospace" fontWeight="bold">PODIUM</text>

                    {INITIAL_DELEGATES.map((del, i) => {
                      const isInner = i < 15;
                      const radius = isInner ? 90 : 155;
                      const rowCount = isInner ? 15 : 22;
                      const rowIndex = isInner ? i : i - 15;
                      const angleStep = (Math.PI * 0.72) / (rowCount - 1);
                      const angle = Math.PI * 0.14 + rowIndex * angleStep;
                      const cx = 220 - radius * Math.cos(angle);
                      const cy = 205 - radius * Math.sin(angle);

                      const isSpeaking = activeSpeakerId === del.id;
                      const vote = activeVotes[del.id];

                      let fill = "#1e293b";
                      let stroke = "#334155";

                      if (isSpeaking) {
                        fill = "#38bdf8";
                        stroke = "#ffffff";
                      } else if (state === 'VOTING' || state === 'VERDICT' || state === 'COMPLETE') {
                        if (vote === 'AYE') { fill = "#10b981"; stroke = "#34d399"; }
                        else if (vote === 'NAY') { fill = "#ef4444"; stroke = "#f87171"; }
                        else if (vote === 'ABSTAIN') { fill = "#f59e0b"; stroke = "#fbbf24"; }
                        else if (vote === 'REFER') { fill = "#8b5cf6"; stroke = "#c084fc"; }
                      } else if (del.isPrimary) {
                        fill = "#1e3a8a";
                        stroke = "#60a5fa";
                      }

                      return (
                        <g key={del.id}>
                          {isSpeaking && <circle cx={cx} cy={cy} r={del.isPrimary ? 13 : 9} fill="none" stroke="#38bdf8" strokeWidth="2" opacity="0.8" />}
                          <circle cx={cx} cy={cy} r={del.isPrimary ? 8 : 5.5} fill={fill} stroke={stroke} strokeWidth={del.isPrimary ? 2 : 1}>
                            <title>{del.name} ({del.role}) - {del.subcommittee}</title>
                          </circle>
                        </g>
                      );
                    })}
                  </svg>
                  
                  {/* Legend */}
                  <div className="absolute bottom-0 flex flex-wrap justify-center gap-3 text-[10px] font-mono text-slate-400 bg-slate-900/90 px-3 py-1.5 rounded-full border border-slate-800">
                    <span className="flex items-center gap-1"><span className="h-2 w-2 rounded-full bg-blue-500" /> Orator</span>
                    <span className="flex items-center gap-1"><span className="h-2 w-2 rounded-full bg-emerald-500" /> Aye</span>
                    <span className="flex items-center gap-1"><span className="h-2 w-2 rounded-full bg-rose-500" /> Nay</span>
                    <span className="flex items-center gap-1"><span className="h-2 w-2 rounded-full bg-amber-500" /> Abstain</span>
                    <span className="flex items-center gap-1"><span className="h-2 w-2 rounded-full bg-purple-500" /> Refer</span>
                  </div>
                </div>
              </div>

              {/* Voting Tally Board */}
              <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-4">
                <div className="flex items-center justify-between mb-3">
                  <h4 className="text-xs font-mono uppercase text-slate-400">Roll-Call Ballots</h4>
                  <span className="text-xs font-mono text-purple-400">37 Quorum Active</span>
                </div>
                <div className="grid grid-cols-4 gap-2 text-center font-mono">
                  <div className="bg-slate-950 p-2.5 rounded-xl border border-emerald-900/30">
                    <span className="text-[10px] text-emerald-400 uppercase">Aye</span>
                    <p className="text-xl font-bold text-emerald-300">{tally.aye}</p>
                  </div>
                  <div className="bg-slate-950 p-2.5 rounded-xl border border-rose-900/30">
                    <span className="text-[10px] text-rose-400 uppercase">Nay</span>
                    <p className="text-xl font-bold text-rose-300">{tally.nay}</p>
                  </div>
                  <div className="bg-slate-950 p-2.5 rounded-xl border border-amber-900/30">
                    <span className="text-[10px] text-amber-400 uppercase">Abstain</span>
                    <p className="text-xl font-bold text-amber-300">{tally.abstain}</p>
                  </div>
                  <div className="bg-slate-950 p-2.5 rounded-xl border border-purple-900/30">
                    <span className="text-[10px] text-purple-400 uppercase">Refer</span>
                    <p className="text-xl font-bold text-purple-300">{tally.refer}</p>
                  </div>
                </div>
              </div>
            </div>

            {/* Right 5 Columns: Live Argument Stream or Final Verdict Card */}
            <div className="lg:col-span-5 flex flex-col">
              {resolution && state === 'COMPLETE' ? (
                <div className="bg-gradient-to-br from-slate-900 via-indigo-950/60 to-slate-900 border-2 border-cyan-500/50 rounded-2xl p-6 shadow-2xl animate-fadeIn space-y-4">
                  <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                    <div>
                      <span className="text-[10px] font-mono text-cyan-400 uppercase tracking-widest">{resolution.id}</span>
                      <h2 className="text-lg font-bold text-slate-100">High Council Ruling</h2>
                    </div>
                    <span className="px-2.5 py-1 bg-red-950 text-red-300 border border-red-500 font-mono text-[10px] font-bold rounded">
                      {resolution.verdict.status}
                    </span>
                  </div>

                  <div>
                    <span className="text-xs font-mono text-slate-400">Dilemma:</span>
                    <p className="text-base text-cyan-200 font-serif italic border-l-2 border-cyan-400 pl-3 mt-1">
                      "{resolution.question}"
                    </p>
                  </div>

                  <p className="text-xs text-slate-300 bg-slate-950/70 p-3 rounded-xl border border-slate-800 leading-relaxed">
                    {resolution.verdict.summary}
                  </p>

                  <div className="bg-slate-950/60 p-3 rounded-xl border border-indigo-900/40 text-xs font-mono space-y-2">
                    <h5 className="text-purple-300 uppercase text-[10px]">New Subcommittees Formed:</h5>
                    <ul className="space-y-1 text-slate-400 text-[11px]">
                      {resolution.verdict.subcommitteesFormed.map((sub, i) => (
                        <li key={i}>▹ {sub}</li>
                      ))}
                    </ul>
                  </div>

                  <div className="flex gap-2 pt-2 border-t border-slate-800">
                    <button
                      onClick={copyVerdict}
                      className="flex-1 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-mono rounded-lg transition"
                    >
                      {copied ? "✓ Copied" : "📋 Copy Verdict"}
                    </button>
                    <button
                      onClick={handleReset}
                      className="flex-1 py-2 bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-mono rounded-lg font-semibold transition"
                    >
                      New Hearing →
                    </button>
                  </div>
                </div>
              ) : (
                <div className="bg-slate-950/80 border border-indigo-900/40 rounded-2xl p-5 shadow-2xl flex-1 flex flex-col">
                  <div className="flex items-center justify-between border-b border-slate-800 pb-2 mb-4">
                    <h3 className="text-xs uppercase font-mono tracking-wider text-slate-400 flex items-center gap-2">
                      <span className="h-2 w-2 rounded-full bg-cyan-400 animate-ping" />
                      Debate Argument Stream
                    </h3>
                    <span className="text-xs font-mono text-slate-500">
                      {activeArguments.length} / 5 Primary Orators
                    </span>
                  </div>

                  <div className="space-y-3 overflow-y-auto max-h-[440px] pr-1 flex-1">
                    {activeArguments.length === 0 ? (
                      <div className="p-8 text-center border border-dashed border-slate-800 rounded-xl text-slate-500 text-xs font-mono">
                        Awaiting dilemma submission to open debates...
                      </div>
                    ) : (
                      activeArguments.map((arg, idx) => (
                        <div key={idx} className="bg-slate-900 border border-slate-800 rounded-xl p-3.5 space-y-2 animate-fadeIn">
                          <div className="flex items-center justify-between">
                            <div className="flex items-center gap-2">
                              <span className="text-xl p-1 bg-slate-800 rounded">{arg.avatar}</span>
                              <div>
                                <h4 className="text-xs font-bold text-slate-200">{arg.role}</h4>
                                <span className="text-[10px] font-mono text-cyan-400">Confidence: {arg.confidence}%</span>
                              </div>
                            </div>
                            <span className="text-[9px] font-mono bg-indigo-950 text-indigo-300 px-1.5 py-0.5 rounded border border-indigo-800">
                              Primary AI
                            </span>
                          </div>
                          <p className="text-xs text-slate-200 font-serif italic border-l-2 border-cyan-500 pl-2">
                            "{arg.position}"
                          </p>
                          <div className="text-[10px] text-slate-400 bg-slate-950 p-2 rounded border border-slate-800/80">
                            <strong>Reasoning:</strong> {arg.reasoning}
                          </div>
                        </div>
                      ))
                    )}
                  </div>
                </div>
              )}
            </div>
          </div>

          {/* Past Decisions Archives */}
          {history.length > 0 && (
            <footer className="border-t border-slate-800 pt-4 mt-auto">
              <span className="text-[11px] font-mono text-slate-500 uppercase tracking-widest block mb-2">
                Archives of Futility:
              </span>
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                {history.map(item => (
                  <div key={item.id} className="bg-slate-900 border border-slate-800/80 p-2.5 rounded-lg text-xs">
                    <span className="text-[10px] font-mono text-cyan-400">{item.id}</span>
                    <p className="text-slate-300 font-medium truncate mt-0.5">"{item.question}"</p>
                    <span className="text-[10px] font-mono text-rose-400 block mt-1">{item.verdict.status}</span>
                  </div>
                ))}
              </div>
            </footer>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
